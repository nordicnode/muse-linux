<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse - can't connect</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f0f12; color: #f0ead9;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
  }
  .card { max-width: 420px; padding: 32px; text-align: center; }
  .mark { font-size: 44px; color: #2f6fd0; font-weight: 700; font-style: italic; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { opacity: .75; margin: 0 0 24px; }
  button {
    background: #0b5ed7; color: #fff; border: 0; border-radius: 999px;
    padding: 10px 28px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #2f6fd0; }
  .hint { margin-top: 16px; font-size: 13px; opacity: .5; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">M</div>
    <h1>Can't reach Muse</h1>
    <p>The page failed to load. This is usually a network problem: no connection, a DNS hiccup, or a proxy issue.</p>
    <button id="retry" type="button">Retry</button>
    <div class="hint">Muse will also retry automatically when your connection comes back.</div>
  </div>
<script>
  var retry = new URLSearchParams(location.search).get('retry') || 'https://muse.ai/';
  function go() { location.href = retry; }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
  // Some connections recover without an 'online' event (VPN and
  // proxy flaps): poll gently and retry when the network is back.
  setInterval(function () { if (navigator.onLine) go(); }, 20000);
</script>
</body>
</html>
