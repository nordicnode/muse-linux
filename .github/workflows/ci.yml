name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check src/main.js && node --check src/preload.js
      - name: Package smoke build (x64 zip layout)
        run: npm run package && ls dist-packager/Muse-linux-x64/Muse
