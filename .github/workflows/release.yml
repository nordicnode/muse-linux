name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Extract this version's changelog section
        run: |
          python3 - <<'EOF'
          import re
          version = "${{ github.ref_name }}".lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## " + re.escape(version) + r"\b.*?(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(0).strip() if m else "See CHANGELOG.md."
          open("release-notes.md", "w").write(notes + "\n")
          print(notes)
          EOF
      - name: Build zip (electron-packager, x64)
        run: |
          npm run package
          cd dist-packager
          zip -qr ../Muse-linux-x64.zip Muse-linux-x64
          cd ..
      - name: Build AppImage + deb (electron-builder, x64 + arm64)
        run: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
      - name: Checksums
        run: sha256sum Muse-linux-x64.zip dist/*.AppImage dist/*.deb dist/latest-linux*.yml > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Muse-linux-x64.zip dist/*.AppImage dist/*.deb dist/latest-linux*.yml SHA256SUMS \
            --title "Muse for Linux ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
