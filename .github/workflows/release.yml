name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Zip and checksum
        run: |
          cd dist
          zip -qr ../Muse-linux-x64.zip Muse-linux-x64
          cd ..
          sha256sum Muse-linux-x64.zip > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Muse-linux-x64.zip SHA256SUMS \
            --title "Muse for Linux ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
